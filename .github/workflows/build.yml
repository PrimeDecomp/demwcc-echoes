name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test
        run: cargo test --locked --workspace

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: mwdec.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: mwdec
          - os: macos-15
            target: aarch64-apple-darwin
            executable: mwdec
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --locked --release -p mwdec
      - name: Package
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])" 2>/dev/null || python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          name="mwdec-$version-${{ matrix.target }}"
          mkdir -p "build/$name" build/releases
          cp "target/release/${{ matrix.executable }}" LICENSE README.md "build/$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            (cd build && 7z a -tzip "releases/$name.zip" "$name" >/dev/null)
            archive="$name.zip"
          else
            tar -C build -czf "build/releases/$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          cd build/releases
          if command -v sha256sum >/dev/null; then sha256sum "$archive" > "$archive.sha256"; else shasum -a 256 "$archive" > "$archive.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: mwdec-${{ matrix.target }}
          path: build/releases/
          if-no-files-found: error

  publish:
    needs: [check, binaries]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: release-input
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          test "$TAG" = "v$version" || { echo "the tag must be v$version"; exit 1; }
          files=(release-input/*/*.zip release-input/*/*.tar.gz release-input/*/*.sha256)
          test "${#files[@]}" -eq 6 || { echo "expected 3 archives and their checksums: ${files[*]}"; exit 1; }
          options=(--verify-tag --generate-notes --title "mwdec $version")
          if [[ "${version%%+*}" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${options[@]}" "${files[@]}"
